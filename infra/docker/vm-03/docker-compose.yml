services:
  ai-jail:
    image: alpine:3.20
    container_name: ai-jail-sandbox
    restart: unless-stopped
    privileged: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    network_mode: none
    entrypoint: ["sh", "-lc", "echo 'Sandbox ready'; while true; do sleep 60; done"]

  vllm:
    image: python:3.12-slim
    container_name: vllm-query
    restart: unless-stopped
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    ports:
      - "8000:8000"
    volumes:
      - /vagrant/src/query_service:/app
    command: bash -lc "cd /app && pip install --no-cache-dir fastapi uvicorn && python fallback_vllm.py"

volumes:
  vllm_cache:
